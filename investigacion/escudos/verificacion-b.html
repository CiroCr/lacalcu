<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Verificación LOTE B</title>
<style>
  body { font-family: sans-serif; background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .cell { text-align: center; border: 1px solid #999; padding: 8px; }
  .cell img { height: 120px; max-width: 140px; }
  .code { font-weight: bold; font-size: 18px; }
  .club { font-size: 11px; color: #333; }
</style>
</head>
<body>
<h2>LOTE B — verificación de escudos</h2>
<div class="grid">
  <div class="cell"><div class="code">SLO</div><img src="SLO.svg"><div class="club">San Lorenzo de Almagro</div></div>
  <div class="cell"><div class="code">DRI</div><img src="DRI.svg"><div class="club">Deportivo Riestra</div></div>
  <div class="cell"><div class="code">PLA</div><img src="PLA.svg"><div class="club">Platense</div></div>
  <div class="cell"><div class="code">TAL</div><img src="TAL.svg"><div class="club">Talleres (Córdoba)</div></div>
  <div class="cell"><div class="code">CCO</div><img src="CCO.svg"><div class="club">Central Córdoba (Sgo. del Estero)</div></div>
  <div class="cell"><div class="code">ARG</div><img src="ARG.svg"><div class="club">Argentinos Juniors</div></div>
  <div class="cell"><div class="code">ROS</div><img src="ROS.png"><div class="club">Rosario Central</div></div>
  <div class="cell"><div class="code">GLP</div><img src="GLP.svg"><div class="club">Gimnasia y Esgrima La Plata</div></div>
  <div class="cell"><div class="code">BEL</div><img src="BEL.svg"><div class="club">Belgrano (Córdoba)</div></div>
  <div class="cell"><div class="code">HUR</div><img src="HUR.svg"><div class="club">Huracán</div></div>
</div>
</body>
</html>
